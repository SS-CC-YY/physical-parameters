[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remake-video-benchmark"
version = "0.1.0"
description = "Model-agnostic video generation benchmark runner for blender/remake"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.20,<5",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "matplotlib>=3.8,<4",
]

[project.scripts]
remake-benchmark = "remake_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
