schema_version: 1.0.0
contract_id: ppb_generation_factorized978_v1
status: frozen-task-contract
purpose: >-
  Cross-model I2V generation handoff for Helios, Cosmos-Predict2.5-14B,
  LongLive2.0, Wan2.2, and later model conditions. The canonical manifest,
  conditioning PNGs, and prompt semantics are immutable; only the model call
  and model-native runtime settings may change.

suite:
  suite_id: ppb-remake-all-13-standard-ball-factorized978-random-seed-audit
  release_id: ppb-remake-1.0.0
  task_type: i2v
  workflow: generation_only
  object_ids: [standard_ball]
  experiment_ids:
    - v1_A
    - v1_B
    - v1_C
    - v1_D
    - v2_A
    - v2_B
    - v2_C
    - v2_D
    - v2_E
    - v3_A
    - v3_B
    - v3_C
    - v3_D
  scene_ids:
    - baseline
    - indoor1
    - indoor2
    - indoor3
    - indoor4
    - outdoor1
    - outdoor2
    - outdoor3
    - outdoor4
  camera_ids: [CAM_Side, CAM_Main, CAM_Top]

counts:
  jobs: 978
  unique_case_ids: 900
  unique_prompt_specs: 900
  unique_rendered_positive_prompt_strings: 100
  experiments: 13
  scenes: 9
  objects: 1
  cameras: 3
  referenced_conditioning_pngs: 351
  selected_experiment_parameter_tuples: 48
  seed_audit_conditions: 26
  primary_seed_jobs: 900
  additional_seed_jobs: 78

seeds:
  primary:
    value: 341867882
    jobs: 900
  audit_only:
    - value: 1750912582
      jobs: 26
    - value: 265635392
      jobs: 26
    - value: 135883006
      jobs: 26
  rules:
    - Never redraw, renumber, increment, or serialize the frozen seeds.
    - Keep the requested seed in metadata even when the provider does not support seed control.
    - Record seed_supported, seed_sent, and effective_seed separately.
    - A provider-uncontrolled repeat must not be reported as deterministic seeded generation.

tracks:
  - id: physics-identification-side
    jobs: 432
    cameras: [CAM_Side]
    scenes: 9
    experiment_parameter_tuples: 48
    seeds: [341867882]
    formula: 48_tuples_x_9_scenes_x_1_camera_x_1_seed
  - id: viewpoint-robustness-main-top
    jobs: 468
    cameras: [CAM_Main, CAM_Top]
    scenes: 9
    experiment_parameter_conditions: 26
    seeds: [341867882]
    formula: 26_conditions_x_9_scenes_x_2_cameras_x_1_seed
  - id: random-seed-stability-audit
    jobs: 78
    cameras: [CAM_Side]
    scene_ids: [baseline]
    experiment_parameter_conditions: 26
    seeds: [1750912582, 265635392, 135883006]
    primary_seed_counterparts_already_in_physics_track: true
    formula: 26_conditions_x_1_scene_x_1_camera_x_3_extra_seeds

canonical_files:
  source_build:
    path: code/builds/standard_ball_factorized978_wan22_generation.yaml
    immutable_sections:
      - overrides.experiment.suite_id
      - overrides.experiment.selection
      - overrides.experiment.generation.num_frames
  experiment_profile:
    path: code/configs/experiments/all_experiments_full.yaml
  prompt_base:
    path: code/configs/prompts/common_physics_video_v1.yaml
  prompt_profile:
    path: code/configs/prompts/all_experiments_explicit_v1.yaml
  schemas:
    - code/schemas/build.schema.json
    - code/schemas/job.schema.json
    - code/schemas/prompt.schema.json
  conditioning_root:
    path: first_frames_v1_0/images
    files_referenced_by_manifest: 351
    git_lfs_required: true
  frozen_run_artifacts:
    - path: manifest.jsonl
      sha256: 0239b849a8d2b2922b460d6586e3898199907fed9602dcaf84882049091f565a
    - path: manifest.selection.json
      sha256: fc9735fa42c86b45c26e7ed70525d925b81850f852a7b77508b80ebe71a6d6ed
    - path: provenance/source_reference_resolved_build.yaml
      sha256: 32e49d12a25299663555669882580f35b997b2d9953b2d9f59cdc79d0b71eb61
      executable_on_receiver: false
      note: Contains source-machine paths and the Wan reference profile; provenance only.
  integrity_records_required:
    - PACKAGE_MANIFEST.json
    - git_commit.txt
    - sha256sums.txt

manifest:
  format: jsonl
  rows: 978
  source_of_truth: true
  job_id_is_output_basename: true
  immutable_job_fields:
    - job_id
    - experiment_id
    - case_id
    - repeat_id
    - task_type
    - seed
    - inputs
    - prompt_spec
    - prompt
    - negative_prompt
    - prompt_mode
    - prompt_template_id
    - prompt_template_version
    - targets
    - known_params
    - factors
    - units
    - generation
    - evaluation_tags
  permitted_cross_model_difference_fields: []
  returned_manifest_must_be_byte_identical: true
  model_identity_storage:
    - model_run.json
    - metadata/<job_id>.json
    - model-specific resolved build outside the frozen manifest
  regeneration_by_model_owner_allowed: false

input_contract:
  conditioning_image_field: inputs.image
  path_base: bundle_root
  expected_pattern: first_frames_v1_0/images/<experiment_id>/<scene_id>/standard_ball/<camera>.png
  use_exact_png_bytes: true
  verify_sha256: true
  preprocessing:
    preserve_source_file: true
    provider_required_resize_or_crop_allowed: true
    record_transform: true
    silent_replacement_allowed: false

prompt_contract:
  canonical_positive_field: prompt
  canonical_negative_field: negative_prompt
  structured_field: prompt_spec
  framework_id: ppb_common_physics_video_v1
  section_order: [task, scene, camera, dynamics, parameter, terminal, quality]
  use_manifest_rendered_text: true
  model_specific_semantic_rewrite_allowed: false
  provider_transform:
    allowed: true
    must_be_versioned: true
    preserve_canonical_and_provider_text: true
    negative_prompt_strategies: [separate, append]

media:
  canonical_container_extension: .mp4
  output_pattern: videos/<job_id>.mp4
  nominal_request:
    width: 832
    height: 480
    fps: 16.0
    frames: 81
    first_to_last_sample_span_seconds: 5.0
    audio: false
    watermark: false
  native_output_policy:
    prefer_duration_seconds: 5.0
    prefer_approximately_480p: true
    preserve_provider_original: true
    video_reencode_allowed: false
    frame_interpolation_allowed: false
    frame_dropping_allowed: false
    playback_speed_change_allowed: false
    trajectory_crop_allowed: false
    lossless_container_remux_allowed: true
    remux_must_be_recorded: true
  actual_media_must_be_probed: true
  actual_media_fields:
    - codec
    - width
    - height
    - fps
    - frame_count
    - duration_seconds
    - time_base
  timeline_rule: Use container timestamps or frame PTS; never assume nominal 16 fps for a native-fps video.

model_change_policy:
  mutable:
    - build_id
    - model profile path
    - adapter implementation
    - provider endpoint
    - checkpoint or provider model revision
    - model-native runtime parameters
    - concurrency within resource limits
  immutable:
    - canonical manifest rows except build_id
    - conditioning image identity
    - canonical positive and negative prompts
    - targets and known parameters
    - scene, object, camera, and seed assignment
    - job_id and output basename
  adapter_must_record:
    - requested_generation
    - actual_generation
    - model_id
    - checkpoint_or_revision
    - adapter_id
    - code_commit
    - prompt_transform_id
    - seed_support_and_effective_seed

required_outputs:
  batch_files:
    - resolved_build.yaml
    - manifest.jsonl
    - manifest.selection.json
    - run_state.jsonl
    - run_summary.json
    - generation_validation.json
    - CHECKSUMS.sha256
  directories:
    - videos
    - metadata
    - logs
  per_job:
    video: videos/<job_id>.mp4
    metadata: metadata/<job_id>.json
    logs:
      - logs/<job_id>.command.json
      - logs/<job_id>.stdout.log
      - logs/<job_id>.stderr.log
  expected_video_files: 978
  expected_metadata_records: 978
  failed_jobs_require_metadata: true

metadata_required_fields:
  - schema_version
  - job_id
  - status
  - manifest_sha256
  - input.image
  - input.image_sha256
  - prompt.canonical
  - prompt.canonical_negative
  - prompt.provider_text
  - prompt.transform_id
  - seed.requested
  - seed.supported
  - seed.sent
  - seed.effective
  - model.owner
  - model.model_id
  - model.checkpoint_or_revision
  - model.adapter
  - model.code_commit
  - requested_generation
  - actual_generation
  - media_probe.codec
  - media_probe.width
  - media_probe.height
  - media_probe.fps
  - media_probe.frame_count
  - media_probe.duration_seconds
  - output_video
  - output_sha256
  - timing.started_at
  - timing.completed_at
  - timing.wall_seconds
  - postprocess
  - error

security:
  credentials_source: environment_or_secret_manager_only
  record_environment_variable_name_only: true
  forbidden_in_repository_or_return_pack:
    - api_key_value
    - bearer_token
    - access_token
    - secret_key
    - credentialed_signed_url_query
  redact_signed_download_url_query_before_external_return: true

rules:
  - Read every task from the frozen manifest; do not reconstruct jobs from filenames.
  - Use the exact conditioning PNG and canonical prompt stored in each manifest row.
  - Only replace the model invocation and explicitly recorded model-native settings.
  - Save every raw canonical video as videos/<job_id>.mp4.
  - Do not append model names, dates, retry labels, or final suffixes to job filenames.
  - Do not transcode, interpolate, drop frames, or change playback speed for apparent uniformity.
  - Record actual FPS, frames, dimensions, duration, and timing from the produced media.
  - Do not hide failures or remove matched jobs from another model condition.
  - Do not run evaluation during generation and do not filter videos by perceived physics quality.
  - Resume the same run without overwriting complete videos and metadata.
  - Reconcile uncertain billable API submissions by task id before any retry.
  - Never place API credentials in manifests, metadata, command records, logs, Git, or return archives.

preflight:
  canary_jobs: 1
  canary_manual_checks:
    - conditioning image identity
    - primary object identity
    - requested camera viewpoint
    - approximately five-second observation span
    - no watermark or subtitle
    - actual media probe present
  final_command: >-
    python code/scripts/validate_generation_outputs.py
    --manifest manifest.jsonl --videos videos --metadata metadata --expected-jobs 978
    --ffprobe required --report generation_validation.json
  acceptance:
    exact_manifest_jobs: 978
    exact_video_basenames_match_manifest: true
    missing_videos: 0
    empty_videos: 0
    extra_videos: 0
    ffprobe_readable_videos: 978
    metadata_records: 978
    secrets_found: 0
    seed_job_counts:
      "341867882": 900
      "1750912582": 26
      "265635392": 26
      "135883006": 26

return_contract:
  root_pattern: outputs/<model_condition>/<run_id>
  return_complete_run_directory: true
  preserve_failed_job_evidence: true
  preserve_provider_task_ids_and_usage: true
  preserve_raw_provider_video_locally: true
  evaluation_artifacts_expected: false

known_limitations:
  - The current reconstruction MVP only implements v1_A plus standard_ball plus CAM_Side.
  - Completion of 978 generation jobs does not imply completion of 13-experiment 3D reconstruction.
  - Native FPS and resolution can differ across providers; evaluation must use actual timestamps and record the difference.
